<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueBank | Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="dashboard-container">
        <header class="dashboard-header">
            <div class="brand dashboard-brand">
                <div class="brand-icon" aria-hidden="true">B</div>
                <h1>BlueBank</h1>
            </div>

            <button type="button" id="logout-button" class="logout-button">
                Sign out
            </button>
        </header>

        <section class="dashboard-welcome">
            <p class="eyebrow">PERSONAL BANKING</p>
            <h2>My Accounts</h2>
            <p id="user-email" class="description"></p>
        </section>

        <div
            id="dashboard-message"
            class="message"
            role="alert"
            aria-live="polite"
            hidden
        ></div>

        <section
            id="accounts-container"
            class="accounts-grid"
            aria-label="Bank accounts"
        ></section>
        <section class="transfer-section" aria-labelledby="transfer-title">
    <h2 id="transfer-title">Transfer Money</h2>
    <p class="description">Transfer funds to another bank account.</p>

    <div
        id="transfer-message"
        class="message"
        role="alert"
        aria-live="polite"
        hidden
    ></div>

    <form id="transfer-form">
        <div class="form-group">
            <label for="source-account">Source Account</label>
            <select id="source-account" name="source_account_number" required>
                <option value="">Select source account</option>
            </select>
        </div>

        <div class="form-group">
            <label for="destination-account">Destination Account Number</label>
            <input
                type="text"
                id="destination-account"
                name="destination_account_number"
                inputmode="numeric"
                pattern="[0-9]{8,20}"
                minlength="8"
                maxlength="20"
                placeholder="Enter destination account number"
                required
            >
        </div>

        <div class="form-group">
            <label for="transfer-amount">Amount</label>
            <input
                type="number"
                id="transfer-amount"
                name="amount"
                min="0.01"
                max="10000"
                step="0.01"
                placeholder="0.00"
                required
            >
        </div>

        <div class="form-group">
            <label for="request-reference">Request Reference</label>
            <input
                type="text"
                id="request-reference"
                name="request_reference"
                minlength="3"
                maxlength="100"
                placeholder="Enter a unique reference"
                required
            >
        </div>

        <button type="submit" id="transfer-button">
            Transfer Money
        </button>
    </form>
</section>
        <footer>
            <p>BlueBank Demo Application · QA Training Project</p>
        </footer>
    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>
