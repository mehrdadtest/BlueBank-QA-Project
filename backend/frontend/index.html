<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueBank | Secure Banking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login-container">
        <section class="login-card" aria-labelledby="page-title">
            <div class="brand">
                <div class="brand-icon" aria-hidden="true">B</div>
                <h1>BlueBank</h1>
            </div>

            <p class="subtitle">Your money. Your control.</p>

            <h2 id="page-title">Welcome back</h2>
            <p class="description">Sign in to access your account.</p>

            <div
                id="login-message"
                class="message"
                role="alert"
                aria-live="polite"
                hidden
            ></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" id="login-button">
                    Sign in
                </button>
            </form>

            <p class="security-note">
                <span aria-hidden="true">🔒</span>
                Secure access to your banking dashboard
            </p>
        </section>

        <footer>
            <p>BlueBank Demo Application · QA Training Project</p>
        </footer>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
